<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fenderswitch footboard</title>
<style>
  :root {
    --bg: #f4f2ee;
    --panel: #e4e0d8;
    --text: #1d1c1a;
    --muted: #6b675f;
    --switch: #2b2a28;
    --switch-text: #f4f2ee;
    --switch-ring: #8a857b;
    --lcd-bg: #9fb83a;
    --lcd-text: #1d2a0a;
    --clean: #2e9d4f;
    --drive: #e0a800;
    --more: #d0342c;
    --off: #b9b4aa;
    --focus: #2f6fd6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --panel: #23221f;
      --text: #ecebe7;
      --muted: #9d998f;
      --switch: #3a3935;
      --switch-text: #ecebe7;
      --switch-ring: #5c5a54;
      --lcd-bg: #1f3a5f;
      --lcd-text: #cfe6ff;
      --off: #4a4843;
      --focus: #6ea2ff;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  main { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 16px; }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.1rem; margin: 0; letter-spacing: 0.02em; }
  .status { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--more); }
  .status.ok .dot { background: var(--clean); }

  /* Display: like the device's 16x2 LCD, plus the three channel LEDs. */
  .display {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .lcd {
    flex: 1;
    background: var(--lcd-bg);
    color: var(--lcd-text);
    border-radius: 6px;
    padding: 10px 14px;
    font: 600 clamp(1.3rem, 5vw, 2rem)/1.2 ui-monospace, "DejaVu Sans Mono", monospace;
    white-space: pre;
    overflow: hidden;
    min-width: 0;
  }
  .leds { display: flex; flex-direction: column; gap: 8px; }
  .led { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--muted); }
  .led i { width: 14px; height: 14px; border-radius: 50%; background: var(--off); transition: background 0.15s, box-shadow 0.15s; }
  .led.on.clean i { background: var(--clean); box-shadow: 0 0 10px var(--clean); }
  .led.on.drive i { background: var(--drive); box-shadow: 0 0 10px var(--drive); }
  .led.on.more i { background: var(--more); box-shadow: 0 0 10px var(--more); }
  .led.on.modified i { animation: swell 1.6s ease-in-out infinite; }
  @keyframes swell { 50% { opacity: 0.25; box-shadow: none; } }

  /* Footswitches. */
  .board {
    background: var(--panel);
    border-radius: 12px;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .bank-row { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .bank-label { font-weight: 600; font-variant-numeric: tabular-nums; }

  button {
    font: inherit;
    color: var(--switch-text);
    background: var(--switch);
    border: 3px solid var(--switch-ring);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }

  .footswitch {
    aspect-ratio: 1;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    transition: transform 0.06s, border-color 0.15s;
    min-width: 0;
  }
  .footswitch:active:not(:disabled) { transform: scale(0.95); }
  .footswitch .num { font-size: clamp(1.2rem, 6vw, 2rem); font-weight: 700; font-variant-numeric: tabular-nums; }
  .footswitch .ch { font-size: 0.7rem; color: var(--switch-text); opacity: 0.75; min-height: 1em; }
  .footswitch.active { border-color: var(--focus); border-width: 5px; }
  .footswitch[data-amp="Clean"] .ch { color: var(--clean); opacity: 1; }
  .footswitch[data-amp="Drive"] .ch { color: var(--drive); opacity: 1; }
  .footswitch[data-amp="More Drive"] .ch { color: var(--more); opacity: 1; }
  .footswitch .key { font-size: 0.65rem; opacity: 0.5; }

  .bank-btn { border-radius: 999px; padding: 8px 18px; font-weight: 600; }

  .direct { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .direct label { color: var(--muted); font-size: 0.9rem; }
  .direct input {
    font: inherit;
    width: 6em;
    padding: 6px 10px;
    border-radius: 8px;
    border: 2px solid var(--switch-ring);
    background: var(--bg);
    color: var(--text);
  }
  .direct button { border-radius: 8px; padding: 6px 14px; }

  details { background: var(--panel); border-radius: 12px; padding: 10px 16px; }
  summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
  #log {
    margin: 10px 0 4px;
    max-height: 220px;
    overflow-y: auto;
    font: 0.8rem/1.45 ui-monospace, "DejaVu Sans Mono", monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #log .out { color: var(--focus); }
  .hint { font-size: 0.8rem; color: var(--muted); margin: 0; }
  .error { color: var(--more); font-size: 0.9rem; min-height: 1.2em; margin: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>fenderswitch footboard</h1>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">connecting …</span></div>
  </header>

  <section class="display" aria-label="Device display">
    <div class="lcd" id="lcd" aria-live="polite">fenderswitch
                </div>
    <div class="leds">
      <div class="led clean" id="led-clean"><i></i>Clean</div>
      <div class="led drive" id="led-drive"><i></i>Drive</div>
      <div class="led more" id="led-more"><i></i>More Drive</div>
    </div>
  </section>

  <section class="board" aria-label="Footswitches">
    <div class="bank-row">
      <button class="bank-btn" id="bank-down" aria-label="Previous bank">◀ Bank</button>
      <span class="bank-label" id="bank-label">Bank 1</span>
      <button class="bank-btn" id="bank-up" aria-label="Next bank">Bank ▶</button>
    </div>
    <!-- Four footswitches, filled in by the script. -->
  </section>

  <form class="direct" id="direct">
    <label for="direct-input">Program</label>
    <input id="direct-input" type="number" min="1" max="128" inputmode="numeric" placeholder="1–128" required>
    <button type="submit">Send</button>
    <p class="error" id="error"></p>
  </form>

  <details>
    <summary>Log</summary>
    <div id="log"></div>
  </details>

  <p class="hint">Keys: 1–4 footswitches, ← → bank. <span id="config"></span></p>
</main>

<script>
  const SWITCHES = 4;
  const PROGRAMS = 128;
  const BANKS = PROGRAMS / SWITCHES;

  const board = document.querySelector('.board');
  const lcd = document.getElementById('lcd');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');
  const bankLabel = document.getElementById('bank-label');
  const errorEl = document.getElementById('error');
  const logEl = document.getElementById('log');
  const leds = {
    'Clean': document.getElementById('led-clean'),
    'Drive': document.getElementById('led-drive'),
    'More Drive': document.getElementById('led-more'),
  };

  let bank = 0;
  let state = { connected: false, program: null, ampChannel: null, modified: false };
  // Amp channel of each program seen so far, from the device's replies.
  const knownChannels = new Map();

  function loadBank() {
    try { return Number(localStorage.getItem('footboard.bank')) || 0; } catch { return 0; }
  }
  function saveBank() {
    try { localStorage.setItem('footboard.bank', String(bank)); } catch { /* ignore */ }
  }

  const switches = [];
  for (let i = 0; i < SWITCHES; i++) {
    const btn = document.createElement('button');
    btn.className = 'footswitch';
    btn.innerHTML = '<span class="num"></span><span class="ch"></span><span class="key"></span>';
    btn.querySelector('.key').textContent = `key ${i + 1}`;
    btn.addEventListener('click', () => send(bank * SWITCHES + i + 1));
    board.appendChild(btn);
    switches.push(btn);
  }

  function render() {
    bankLabel.textContent = `Bank ${bank + 1} / ${BANKS}`;
    switches.forEach((btn, i) => {
      const program = bank * SWITCHES + i + 1;
      btn.querySelector('.num').textContent = program;
      const amp = knownChannels.get(program);
      btn.querySelector('.ch').textContent = amp ?? '';
      if (amp) btn.dataset.amp = amp; else delete btn.dataset.amp;
      btn.classList.toggle('active', program === state.program);
      btn.disabled = !state.connected;
      btn.setAttribute('aria-label', `Program ${program}${amp ? ', ' + amp : ''}`);
    });

    statusEl.classList.toggle('ok', state.connected);
    statusText.textContent = state.connected ? 'connected' : 'device not connected';

    // Same layout as the device: "P12  Drive*".
    if (state.program) {
      const line = `P${String(state.program).padEnd(3)} ${state.ampChannel}${state.modified ? '*' : ''}`;
      lcd.textContent = 'fenderswitch    \n' + line;
    }
    for (const [name, led] of Object.entries(leds)) {
      const on = name === state.ampChannel;
      led.classList.toggle('on', on);
      led.classList.toggle('modified', on && state.modified);
    }
  }

  function setBank(next) {
    bank = (next + BANKS) % BANKS;
    saveBank();
    render();
  }

  async function send(program) {
    errorEl.textContent = '';
    try {
      const res = await fetch('/api/program', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ program }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        errorEl.textContent = body.error ?? `HTTP ${res.status}`;
      }
    } catch (err) {
      errorEl.textContent = `server not reachable: ${err.message}`;
    }
  }

  function log(dir, text) {
    const line = document.createElement('div');
    line.className = dir;
    line.textContent = `${dir === 'out' ? '>' : '<'} ${text}`;
    logEl.appendChild(line);
    while (logEl.childElementCount > 200) logEl.firstChild.remove();
    logEl.scrollTop = logEl.scrollHeight;
  }

  document.getElementById('bank-down').addEventListener('click', () => setBank(bank - 1));
  document.getElementById('bank-up').addEventListener('click', () => setBank(bank + 1));
  document.getElementById('direct').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('direct-input');
    const program = Number(input.value);
    if (Number.isInteger(program) && program >= 1 && program <= PROGRAMS) {
      setBank(Math.floor((program - 1) / SWITCHES));
      send(program);
      input.select();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key >= '1' && e.key <= String(SWITCHES)) {
      send(bank * SWITCHES + Number(e.key));
    } else if (e.key === 'ArrowLeft') {
      setBank(bank - 1);
    } else if (e.key === 'ArrowRight') {
      setBank(bank + 1);
    } else {
      return;
    }
    e.preventDefault();
  });

  // Live updates from the server. EventSource reconnects by itself.
  const events = new EventSource('/api/events');
  events.addEventListener('state', (e) => {
    state = JSON.parse(e.data);
    if (state.program && state.ampChannel) knownChannels.set(state.program, state.ampChannel);
    render();
  });
  events.addEventListener('log', (e) => {
    const { dir, text } = JSON.parse(e.data);
    log(dir, text);
  });
  events.addEventListener('config', (e) => {
    const { midiChannel, serialPort } = JSON.parse(e.data);
    document.getElementById('config').textContent = `Sending on MIDI channel ${midiChannel} via ${serialPort}.`;
  });
  events.onerror = () => {
    state = { ...state, connected: false };
    statusText.textContent = 'server not reachable';
    statusEl.classList.remove('ok');
    switches.forEach((btn) => { btn.disabled = true; });
  };

  bank = Math.min(Math.max(loadBank(), 0), BANKS - 1);
  render();
</script>
</body>
</html>
