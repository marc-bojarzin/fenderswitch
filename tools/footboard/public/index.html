<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fenderswitch Test Rig</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 8px; }
  header { max-width: 1480px; margin: 0 auto; padding: 8px 8px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 1.1rem; margin: 0; }
  header nav { font-size: 0.85rem; display: flex; gap: 14px; }
  header a { color: var(--focus); }
  /* Two separate devices; side by side when there is room, stacked on a phone. */
  .rig { max-width: 1480px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }
  .unit { display: flex; flex-direction: column; min-width: 0; }
  .cable { font-size: 0.75rem; color: var(--muted); text-align: center; padding: 0 16px; }
  iframe { width: 100%; border: 0; display: block; height: 520px; }
</style>
</head>
<body>
<header>
  <h1>fenderswitch test rig</h1>
  <nav>
    <a href="footboard.html">Footboard only</a>
    <a href="monitor.html">Monitor only</a>
  </nav>
</header>
<div class="rig">
  <div class="unit">
    <iframe id="footboard" src="footboard.html" title="MIDI footboard"></iframe>
  </div>
  <div class="unit">
    <iframe id="monitor" src="monitor.html" title="fenderswitch device monitor"></iframe>
  </div>
</div>
<p class="cable">Footboard → MIDI (USB serial, 31250 baud) → fenderswitch. The monitor reads the device's serial output.</p>

<script>
  const frames = {
    footboard: document.getElementById('footboard'),
    monitor: document.getElementById('monitor'),
  };

  // Each frame reports its content height.
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin) return;
    const { frame, frameHeight } = e.data ?? {};
    if (frames[frame] && Number.isFinite(frameHeight)) {
      frames[frame].style.height = `${frameHeight}px`;
    }
  });

  // Keys pressed on this page (outside the frames) go to the footboard.
  document.addEventListener('keydown', (e) => {
    const handler = frames.footboard.contentWindow?.footboardKey;
    if (handler && handler(e)) e.preventDefault();
  });
</script>
</body>
</html>
