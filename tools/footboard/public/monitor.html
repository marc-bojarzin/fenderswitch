<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Device Monitor</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 16px; }
  main { max-width: 720px; margin: 0 auto; }

  /* Front panel: the 4-digit 7-segment display (TM1637, with colon) and the
     three channel LEDs. */
  .front { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .seg {
    background: var(--seg-bg);
    border-radius: 6px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .seg svg { width: clamp(28px, 8vw, 40px); height: auto; display: block; overflow: visible; }
  .seg svg.colon { width: clamp(6px, 1.6vw, 8px); }
  .seg polygon, .seg circle { fill: var(--seg-on); opacity: 0.1; transition: opacity 0.08s; }
  .seg .lit { opacity: 1; filter: drop-shadow(0 0 3px var(--seg-on)); }
  .leds { display: flex; flex-direction: column; gap: 8px; }
  .led { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .led i { width: 14px; height: 14px; border-radius: 50%; background: var(--off); transition: background 0.15s, box-shadow 0.15s; }
  .led.on.clean i { background: var(--clean); box-shadow: 0 0 10px var(--clean); }
  .led.on.drive i { background: var(--drive); box-shadow: 0 0 10px var(--drive); }
  .led.on.more i { background: var(--more); box-shadow: 0 0 10px var(--more); }
  .led.on.modified i { animation: swell 1.6s ease-in-out infinite; }
  @keyframes swell { 50% { opacity: 0.25; box-shadow: none; } }

  .log-head { display: flex; justify-content: space-between; align-items: baseline; }
  .log-head h2 { font-size: 0.85rem; margin: 0; color: var(--muted); font-weight: 600; }
  .log-head button { font-size: 0.75rem; padding: 2px 10px; border-radius: 999px; border-width: 1px; }
  #log {
    background: var(--bg);
    border-radius: 8px;
    padding: 8px 10px;
    height: 220px;
    overflow-y: auto;
    font: 0.78rem/1.45 ui-monospace, "DejaVu Sans Mono", monospace;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #log .midi { color: var(--focus); }
  #log .serial { color: var(--text); }
</style>
</head>
<body>
<main>
  <section class="device" aria-label="fenderswitch device monitor">
    <div class="plate">
      <h1>fenderswitch · monitor</h1>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">connecting …</span></div>
    </div>

    <div class="front">
      <div class="seg" id="seg" role="img" aria-live="polite" aria-label="Display: blank"></div>
      <div class="leds">
        <div class="led clean" id="led-clean"><i></i>Clean</div>
        <div class="led drive" id="led-drive"><i></i>Drive</div>
        <div class="led more" id="led-more"><i></i>More Drive</div>
      </div>
    </div>

    <div class="log-head">
      <h2>MIDI in &amp; serial output</h2>
      <button id="clear">Clear</button>
    </div>
    <div id="log"></div>

    <p class="hint">Read from the firmware's serial output over USB. A real MIDI cable has no way back; this view is for testing. <span id="config"></span></p>
  </section>
</main>

<script>
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('status-text');
  const logEl = document.getElementById('log');
  const leds = {
    'Clean': document.getElementById('led-clean'),
    'Drive': document.getElementById('led-drive'),
    'More Drive': document.getElementById('led-more'),
  };

  function render(device) {
    statusEl.classList.toggle('ok', device.connected);
    statusText.textContent = device.connected ? 'connected' : 'not connected';

    // Same as the device: the program number, right-aligned.
    if (device.program && !menu) showSeg(String(device.program));
    lastProgram = device.program;
    for (const [name, led] of Object.entries(leds)) {
      const on = name === device.ampChannel;
      led.classList.toggle('on', on);
      led.classList.toggle('modified', on && device.modified);
    }
  }

  // 4-digit 7-segment display with a colon between digits 2 and 3, like the
  // TM1637 module. Segments a-g, in a 40 x 70 box, slanted.
  const SEGMENTS = {
    a: [[8, 2], [32, 2], [28, 7], [12, 7]],
    b: [[33, 3], [33, 33], [30, 35], [28, 32], [28, 8]],
    c: [[33, 37], [33, 67], [28, 62], [28, 38], [30, 35]],
    d: [[8, 68], [32, 68], [28, 63], [12, 63]],
    e: [[7, 37], [10, 35], [12, 38], [12, 62], [7, 67]],
    f: [[7, 3], [12, 8], [12, 32], [10, 35], [7, 33]],
    g: [[10, 35], [13, 32.5], [27, 32.5], [30, 35], [27, 37.5], [13, 37.5]],
  };
  const GLYPHS = {
    '0': 'abcdef', '1': 'bc', '2': 'abdeg', '3': 'abcdg', '4': 'bcfg',
    '5': 'acdfg', '6': 'acdefg', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg',
    '-': 'g', ' ': '',
  };
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const segEl = document.getElementById('seg');
  const digits = [];
  let colonDots = [];
  const slant = (x, y) => `${x + (35 - y) * 0.1},${y}`;
  for (let i = 0; i < 4; i++) {
    if (i === 2) {
      const svg = document.createElementNS(SVG_NS, 'svg');
      svg.setAttribute('viewBox', '0 0 8 70');
      svg.setAttribute('class', 'colon');
      svg.setAttribute('aria-hidden', 'true');
      colonDots = [22, 48].map((y) => {
        const dot = document.createElementNS(SVG_NS, 'circle');
        const [cx] = slant(4, y).split(',').map(Number);
        dot.setAttribute('cx', cx);
        dot.setAttribute('cy', y);
        dot.setAttribute('r', 3);
        svg.appendChild(dot);
        return dot;
      });
      segEl.appendChild(svg);
    }
    const svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 40 70');
    svg.setAttribute('aria-hidden', 'true');
    const parts = {};
    for (const [name, points] of Object.entries(SEGMENTS)) {
      const poly = document.createElementNS(SVG_NS, 'polygon');
      poly.setAttribute('points', points.map(([x, y]) => slant(x, y)).join(' '));
      svg.appendChild(poly);
      parts[name] = poly;
    }
    segEl.appendChild(svg);
    digits.push(parts);
  }

  // Shows text (up to 4 characters, right-aligned) on the display.
  function showSeg(text, colon = false) {
    const chars = text.padStart(4, ' ').slice(-4);
    digits.forEach((parts, i) => {
      const lit = GLYPHS[chars[i]] ?? '';
      for (const [name, poly] of Object.entries(parts)) {
        poly.classList.toggle('lit', lit.includes(name));
      }
    });
    colonDots.forEach((dot) => dot.classList.toggle('lit', colon));
    segEl.setAttribute('aria-label', text.trim() ? `Display: ${text.trim()}` : 'Display: blank');
  }

  // Menu mode, read from the firmware's "menu on" / "menu off" lines: the
  // device shows "----" until the menu is left again.
  let menu = false;
  let lastProgram = null;
  function trackMenu(text) {
    if (text === 'menu on') {
      menu = true;
      showSeg('----');
    } else if (text === 'menu off') {
      menu = false;
      showSeg(lastProgram ? String(lastProgram) : '');
    }
  }

  function log(dir, text) {
    const atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 4;
    const line = document.createElement('div');
    line.className = dir;
    const time = new Date().toLocaleTimeString([], { hour12: false });
    line.textContent = `${time} ${dir === 'midi' ? 'MIDI ' : '     '}${text}`;
    logEl.appendChild(line);
    while (logEl.childElementCount > 300) logEl.firstChild.remove();
    if (atBottom) logEl.scrollTop = logEl.scrollHeight;
  }

  document.getElementById('clear').addEventListener('click', () => { logEl.textContent = ''; });

  // Live updates. EventSource reconnects by itself.
  const events = new EventSource('/api/monitor/events');
  events.addEventListener('device', (e) => render(JSON.parse(e.data)));
  events.addEventListener('log', (e) => {
    const { dir, text } = JSON.parse(e.data);
    log(dir, text);
    if (dir === 'serial') trackMenu(text.trim());
  });
  events.addEventListener('config', (e) => {
    const { serialPort } = JSON.parse(e.data);
    document.getElementById('config').textContent = `Port: ${serialPort}.`;
  });
  events.onerror = () => {
    statusText.textContent = 'server not reachable';
    statusEl.classList.remove('ok');
  };

  if (window.parent !== window) {
    new ResizeObserver(() => {
      window.parent.postMessage({ frameHeight: document.documentElement.scrollHeight, frame: 'monitor' }, location.origin);
    }).observe(document.body);
  }
</script>
</body>
</html>
