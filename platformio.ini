; PlatformIO project for the CH340 Nano clone (old bootloader, 57600 baud)
[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 31250  ; MIDI baud rate, see SERIAL_BAUD in src/main.cpp
; C++17 instead of the core's gnu++11; no -fpermissive, so sloppy code fails.
build_unflags = -std=gnu++11 -fpermissive
build_flags = -std=gnu++17
lib_deps =
  ; LCD, currently unused (see LCD_I2C_ADDR in src/main.cpp)
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  ; TM1637 7-segment display (TM1637Display); not in the PIO registry under
  ; its own name, so pinned by git tag
  https://github.com/avishorp/TM1637.git#v1.2.0
